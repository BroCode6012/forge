<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: asset: file:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob: asset: file:; img-src 'self' data: blob: asset: file: https:; connect-src 'self' data: blob: asset: file: https:; font-src 'self' data: asset: file:; object-src 'none'; base-uri 'none';">
<title>QA Agent Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Header ── */
.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
}
.header h1 { font-size: 14px; font-weight: 600; color: #fff; }
.header .subtitle { font-size: 11px; color: #666; }

#project-bar { font-size: 11px; color: #555; }
#project-bar span { color: #7dd3a8; }

.niche-select {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
}
.niche-select label { font-size: 11px; color: #888; }
.niche-select select {
    background: #252525;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
}
.niche-select select:focus { outline: none; border-color: #555; }

#btn-clear {
    background: transparent;
    border: 1px solid #333;
    color: #888;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
}
#btn-clear:hover { background: #252525; color: #ccc; }

/* ── Messages ── */
#messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

.msg {
    display: flex;
    gap: 10px;
    max-width: 92%;
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.agent { align-self: flex-start; }

.msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
}
.msg.user  .msg-avatar { background: #2563eb; }
.msg.agent .msg-avatar { background: #1e3a2f; color: #4ade80; }

.msg-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}
.msg.user  .msg-bubble { background: #1d3461; border-bottom-right-radius: 3px; }
.msg.agent .msg-bubble { background: #1a1a1a; border: 1px solid #252525; border-bottom-left-radius: 3px; }

/* markdown-style code blocks in agent responses */
.msg-bubble code {
    background: #0d0d0d;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #7dd3a8;
}

.msg-meta {
    font-size: 10px;
    color: #444;
    margin-top: 4px;
    padding: 0 4px;
}
.msg.user .msg-meta { text-align: right; }

/* Typing indicator */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #252525;
    border-radius: 12px;
    border-bottom-left-radius: 3px;
}
.typing-dot {
    width: 6px; height: 6px;
    background: #555;
    border-radius: 50%;
    animation: typingLift 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingLift {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); background: #7dd3a8; }
}

/* ── Input ── */
.input-area {
    padding: 12px 16px;
    background: #1a1a1a;
    border-top: 1px solid #252525;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
}
#msg-input {
    flex: 1;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 13px;
    padding: 10px 12px;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.4;
}
#msg-input:focus { outline: none; border-color: #444; }
#msg-input::placeholder { color: #555; }

#btn-send {
    background: #1a4731;
    border: 1px solid #2d6a4f;
    color: #4ade80;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.15s;
}
#btn-send:hover  { background: #1e5438; }
#btn-send:active { background: #163d26; }
#btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── System message ── */
.sys-msg {
    text-align: center;
    font-size: 11px;
    color: #444;
    padding: 4px 0;
}

/* ── Quick prompts ── */
.quick-prompts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 16px 10px;
    flex-shrink: 0;
}
.quick-btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #888;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
}
.quick-btn:hover { background: #252525; color: #ccc; border-color: #3a3a3a; }
</style>
<link rel="stylesheet" href="css/cut-ledger-surfaces.css">
</head>
<body class="cut-qa-chat">

<div class="header">
    <div>
        <h1>QA Agent Chat</h1>
        <div class="subtitle" id="project-bar">Loading project...</div>
    </div>
    <div class="niche-select">
        <label>Focus niche:</label>
        <select id="niche-select">
            <option value="">No niche (general)</option>
        </select>
    </div>
    <button id="btn-clear">Clear</button>
</div>

<div id="messages">
    <div class="sys-msg">Select a niche and ask the agent anything about QA rules, footage, MGs, replacements...</div>
</div>

<div class="quick-prompts" id="quick-prompts">
    <button class="quick-btn" data-q="What MG types are allowed for this niche? List them.">MGs allowed?</button>
    <button class="quick-btn" data-q="What does good footage look like for this niche? Describe the visual style.">Visual style?</button>
    <button class="quick-btn" data-q="What footage sources should I use for replacements in this niche?">Sources?</button>
    <button class="quick-btn" data-q="What kind of footage should I reject or flag for this niche?">Reject rules?</button>
    <button class="quick-btn" data-q="Give me 3 examples of good replacement keywords for this niche.">Keyword examples?</button>
    <button class="quick-btn" data-q="If I see dark moody desaturated footage in this niche, should I flag it?">Dark footage?</button>
    <button class="quick-btn" data-q="What templates are allowed for this niche and at what density?">Templates?</button>
    <button class="quick-btn" data-q="Explain the full QA scoring system and when each verdict is used.">Scoring?</button>
</div>

<div class="input-area">
    <textarea id="msg-input" placeholder="Ask the agent anything..." rows="1"></textarea>
    <button id="btn-send">Send</button>
</div>

<script src="js/qa-chat-app.js"></script>
</body>
</html>
